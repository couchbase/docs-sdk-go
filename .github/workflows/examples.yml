name: Examples

on:
  push:
    branches:
      - release/2.*

  pull_request:
    branches:
      - release/2.*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - working-directory: ./modules/devguide/examples/go
        run: |
          make lint
        

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - working-directory: ./modules/devguide/examples/go
        run: |
          make build
